<!DOCTYPE html>
<html lang="pt-BR">
<head><meta name="robots" content="noindex,nofollow">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16294F">
<title>Eder Balbino · Tela Vertical</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--tv-navy:#16294F;--tv-navy-deep:#0E1B36;--tv-gold:#C0A062;--tv-gold-light:#E2CFA3;--tv-champagne:#F3EDE2;--tv-sky:#6FC7E8;--tv-ink:#1B1F2A;--tv-muted:#6B7280;--tv-line:rgba(22,41,79,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--tv-champagne);color:var(--tv-ink);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:400px;min-height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(22,41,79,.18)}
@media(min-width:480px){.card{min-height:auto;border-radius:28px;overflow:hidden;margin:24px 0}}
.top{background:radial-gradient(600px 300px at 90% 0%,rgba(192,160,98,.28),transparent 60%),linear-gradient(160deg,var(--tv-navy) 0%,#1C3563 65%,var(--tv-navy-deep) 100%);color:#fff;padding:34px 28px 30px;position:relative;overflow:hidden}
.top::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px);pointer-events:none}
.top>*{position:relative;z-index:1}
.top svg{width:170px;height:auto;display:block}
.nome{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:26px}
.cargo{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tv-sky);font-weight:600;margin-top:6px}
.empresa{font-size:13px;color:rgba(255,255,255,.75);margin-top:10px}
.body{padding:22px 22px 26px;display:flex;flex-direction:column;gap:10px;flex:1}
.btn{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--tv-line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--tv-navy);font-weight:600;font-size:15px;transition:transform .08s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn .ic{width:40px;height:40px;border-radius:12px;background:var(--tv-navy);display:flex;align-items:center;justify-content:center;flex:none}
.btn .ic svg{width:20px;height:20px;fill:none;stroke:var(--tv-sky);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn small{display:block;font-size:12px;color:var(--tv-muted);font-weight:400;margin-top:1px}
.btn.wa .ic{background:#1f8a4c}.btn.wa .ic svg{stroke:#fff}
.btn.primary{background:var(--tv-gold);border-color:var(--tv-gold);color:var(--tv-navy);justify-content:center;font-weight:700;margin-top:6px;cursor:pointer;font-family:inherit;width:100%}
.btn.primary .ic{background:rgba(22,41,79,.15)}.btn.primary .ic svg{stroke:var(--tv-navy)}
.foot{padding:18px 22px 26px;border-top:1px solid var(--tv-line);text-align:center}
.assin{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tv-muted);font-weight:500}
.predial{display:inline-flex;align-items:baseline;gap:5px;margin-top:8px;border-bottom:2px solid var(--tv-gold);padding-bottom:3px}
.predial .g{font-weight:400;letter-spacing:.3em;color:var(--tv-gold);font-size:11px}
.predial .p{font-weight:800;color:var(--tv-navy);font-size:17px;letter-spacing:.02em}
.mgb{font-size:10px;color:#9CA3AF;margin-top:12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tv-navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
</style>
</head>

<script>
/* ====== DADOS DO CARTÃO — troque aqui ====== */
const DADOS = {
  nome:      'Eder Balbino',
  cargo:     'Diretor comercial',
  empresa:   'Tela Vertical · Mídia em Elevadores',
  telefone:  '(43) 99696-0078',        // como aparece
  whatsapp:  '5543996960078',          // só números, com 55
  email:     'contato@telavertical.com.br',   // provisório até registrar o domínio
  instagram: '@telavertical',
  site:      'telavertical.com.br',    // futuro
  endereco:  'Rua Raul Juliatto, 200;Londrina;PR;;Brasil',
  nota:      'Tela Vertical — uma empresa do Grupo Predial. MGB Mídia Comunicação LTDA, CNPJ 23.770.170/0001-50.'
};
/* =========================================== */

const $ = id => document.getElementById(id);
$('v-nome').textContent = DADOS.nome;
$('v-cargo').textContent = DADOS.cargo;
$('v-tel1').textContent = DADOS.telefone;
$('v-tel2').textContent = DADOS.telefone;
$('v-mail').textContent = DADOS.email;
$('v-ig').textContent = DADOS.instagram;
$('v-site').textContent = DADOS.site;
document.title = DADOS.nome + ' · Tela Vertical';

const msg = encodeURIComponent('Olá, ' + DADOS.nome.split(' ')[0] + '! Vi seu cartão da Tela Vertical e quero saber mais.');
$('b-wa').href   = 'https://wa.me/' + DADOS.whatsapp + '?text=' + msg;
$('b-tel').href  = 'tel:+' + DADOS.whatsapp;
$('b-mail').href = 'mailto:' + DADOS.email;
$('b-ig').href   = 'https://instagram.com/' + DADOS.instagram.replace(/^@/,'');
$('b-site').href = 'https://' + DADOS.site;

/* vCard 3.0 gerado no navegador */
function vcard(){
  const [primeiro, ...resto] = DADOS.nome.split(' ');
  const sobrenome = resto.join(' ');
  const l = [
    'BEGIN:VCARD','VERSION:3.0',
    'N:' + sobrenome + ';' + primeiro + ';;;',
    'FN:' + DADOS.nome,
    'ORG:Tela Vertical (Grupo Predial);MGB Mídia Comunicação LTDA',
    'TITLE:' + DADOS.cargo,
    'TEL;TYPE=CELL,VOICE:+' + DADOS.whatsapp,
    'EMAIL;TYPE=INTERNET,WORK:' + DADOS.email,
    'URL:https://' + DADOS.site,
    'X-SOCIALPROFILE;TYPE=instagram:https://instagram.com/' + DADOS.instagram.replace(/^@/,''),
    'ADR;TYPE=WORK:;;' + DADOS.endereco,
    'NOTE:' + DADOS.nota.replace(/,/g,'\\,'),
    'END:VCARD'
  ];
  return l.join('\r\n');
}
$('b-vcard').addEventListener('click', () => {
  const blob = new Blob([vcard()], {type:'text/vcard;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = DADOS.nome.replace(/\s+/g,'-') + '-tela-vertical.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  const t = $('toast'); t.textContent = 'Contato gerado — abra o arquivo .vcf para salvar.'; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 3500);
});
</script>
