<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><pre id="out">…</pre>
<iframe id="f" style="width:1400px;height:900px"></iframe>
<script>
var f=document.getElementById('f'); f.src='http://localhost:8941/index.html?cb='+Date.now();
var L=[];
setTimeout(function(){
  try{
    var w=f.contentWindow, d=f.contentDocument;
    L.push('sidebar item: '+!!d.getElementById('nav-radioops')+' · home card: '+!!d.getElementById('home-rops-card')+' · alert oculto: '+(d.getElementById('home-rops-alert').style.display==='none'));
    var mock={ano:'2026',geradoEm:new Date().toISOString(),cfg:{},meses:[{mes:'2026-09',notaMGB:5100,frentes:3,radios:4,bruto:20000,economia:3000,comissoes:900,fee:4000,connectmix:200,liquidosRadios:0,desembolsoCliente:0}],
      relatorios:[{mes:'2026-09',enviadoEm:'2026-09-19',aceiteEm:'2026-09-21T10:00:00Z',aprovadoNome:'Diego',obsCliente:'',nfEmitidaEm:''}],painel:{decisoes:2,notasPendentes:['2026-09']}};
    w.mgbRadioOpsCb(mock);
    var ha=d.getElementById('home-rops-alert'); L.push('home alert: '+ha.style.display+' → '+ha.textContent.replace(/\s+/g,' ').slice(0,140));
    L.push('card desc: '+d.getElementById('home-rops-desc').textContent+' · badge: '+d.getElementById('nav-rops-badge').style.display);
    w.goPage('radioops');
    setTimeout(function(){
      var pg=d.getElementById('page-radioops'); L.push('page visível: '+(pg.style.display==='block')+' · abas: '+[].map.call(pg.querySelectorAll('.rops-tab'),function(t){return t.textContent+(t.classList.contains('on')?'*':'')}).join(', '));
      L.push('painel wrap: '+d.getElementById('rops-painel-wrap').textContent.replace(/\s+/g,' ').trim().slice(0,100)+' · iframe: '+!!d.getElementById('rops-frame'));
      L.push('nf alert página: '+d.getElementById('rops-nf-alert').style.display);
      w.ropsSetTab('resumo'); L.push('resumo visível: '+(d.getElementById('rops-resumo-wrap').style.display==='block')+' · kpis: '+d.getElementById('rops-kpis').children.length+' · tabela linhas: '+d.querySelectorAll('#rops-tabela tr').length);
      document.getElementById('out').textContent=L.join('\n');
    },500);
  }catch(e){ document.getElementById('out').textContent='ERRO '+e.message+'\n'+L.join('\n'); }
},6000);
</script></body></html>
