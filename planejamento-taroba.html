<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Montador de Planejamento — Grupo Tarobá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--wine:#7A0026;--wine-d:#5A001B;--gold:#C9A84C;--bg:#F4F1EE;--card:#fff;--line:#E3DDD7;--ink:#1A1A1A;--mut:#6B6B6B;--ok:#2E7D27}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:var(--wine);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 24px;flex-wrap:wrap;box-shadow:0 2px 14px rgba(0,0,0,.25)}
header h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.35rem;letter-spacing:.02em;text-transform:uppercase;margin-right:8px}
header h1 span{color:var(--gold)}
.tabs{display:flex;gap:4px}
.tabs button{background:rgba(255,255,255,.12);color:#fff;border:0;padding:8px 16px;border-radius:6px;font:600 13px 'Barlow';cursor:pointer}
.tabs button.on{background:var(--gold);color:var(--wine-d)}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.acts button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);padding:7px 12px;border-radius:6px;font:600 12px 'Barlow';cursor:pointer}
.acts button:hover{background:rgba(255,255,255,.12)}
.acts button.pri{background:var(--gold);border-color:var(--gold);color:var(--wine-d)}
#montar{max-width:1280px;margin:20px auto;padding:0 20px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.35rem;color:var(--wine);text-transform:uppercase;letter-spacing:.01em;margin-bottom:6px}
.hint{color:var(--mut);font-size:12px;font-weight:400}
p.hint{margin-bottom:12px}
p.info{margin:10px 0;font-size:13px;color:var(--mut)}
p.ok{color:var(--ok);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-top:10px}
.grid2 .w2{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12px;color:#333}
input,textarea,select{font:14px 'Barlow',sans-serif;border:1px solid #D2CBC4;border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
input[type=checkbox]{width:auto;accent-color:var(--wine)}
.chips{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:8px}
.chip{flex-direction:row;align-items:center;gap:6px;background:#F7F3EF;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-weight:600;cursor:pointer}
.chip.inl{border-radius:6px}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.logoPrev{display:flex;align-items:center;gap:10px;margin-top:6px}
.logoPrev img{height:44px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
button.add{margin-top:12px;background:#fff;border:1.5px dashed var(--wine);color:var(--wine);font:700 13px 'Barlow';padding:8px 14px;border-radius:6px;cursor:pointer}
button.add:hover{background:#FBEFF2}
button.danger{margin-top:10px;background:#fff;border:1px solid #c0392b;color:#c0392b;font:600 12px 'Barlow';padding:6px 12px;border-radius:6px;cursor:pointer}
button.x,button.gear,.logoPrev button{background:none;border:0;cursor:pointer;color:var(--mut);font-size:13px}
button.x:hover{color:#c0392b}
button.gear{font-size:15px;margin-left:6px}
button.gear:hover{color:var(--wine)}
.scroll{overflow-x:auto}
table.tb{border-collapse:collapse;width:100%;min-width:880px}
.tb th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;text-align:left;padding:6px 6px;border-bottom:2px solid var(--line)}
.tb th.pr{text-align:center;color:var(--wine);background:#FBF6F2;border-bottom:1px solid var(--line)}
.tb th i{text-transform:none;font-weight:500}
.tb td{padding:5px 6px;border-bottom:1px solid #EFEAE5;vertical-align:middle}
.tb td.pn{min-width:240px}
.tb td.pn b{display:block;font-size:13.5px}
.tb td.pn span{font-size:11.5px;color:var(--mut)}
.tb td.ck,.tb th.ck{text-align:center;width:44px}
.tb input.m{width:104px;text-align:right}
.tb input.q{width:60px;text-align:center}
.tb input.fmt{min-width:230px}
.tb td.pct{width:64px;text-align:center;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}
.tb td.pct.neg{color:#c0392b}
.tb td.sub{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb tr.prow.off td:not(.pn):not(.ck) input{opacity:.55}
.tb tr.prow.off td.pn b{color:#777;font-weight:600}
.tb tr.prow:not(.off){background:#FFFBEF}
.tb tr.det td{background:#FAF7F4;padding:14px 16px}
.tb td.empty{text-align:center;color:var(--mut);padding:22px}
details.sub{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.sub summary{cursor:pointer;font-weight:700;color:var(--wine);font-size:13px}
details.mais{position:relative}
details.mais summary{list-style:none;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.4);padding:7px 12px;border-radius:6px;font:600 12px 'Barlow'}
details.mais summary::-webkit-details-marker{display:none}
details.mais .menu{position:absolute;right:0;top:36px;background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.3);padding:6px;display:flex;flex-direction:column;min-width:290px;z-index:40}
details.mais .menu button{color:var(--ink);border:0;text-align:left;padding:10px 12px;font:600 13px 'Barlow';border-radius:6px}
details.mais .menu button:hover{background:#F4F1EE}
.ia{background:#FBF6F2;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.thumb{position:relative}
.thumb img{height:84px;width:auto;border-radius:6px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px}
.fotos.drag{outline:2px dashed var(--gold)}
table.mkt{min-width:0}
table.mkt td input{width:100%}
button.add.pri{background:var(--wine);color:#fff;border:1.5px solid var(--wine)}
button.add.pri:hover{background:var(--wine-d)}
button.add:disabled{opacity:.6;cursor:wait}
.iabox{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.iabox textarea{font-size:12.5px}
#resumo{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:#fff;display:flex;gap:26px;padding:12px 24px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
#resumo[hidden],#montar[hidden],#previa[hidden]{display:none}
.rs{display:flex;gap:10px;align-items:baseline;font-size:13px}
.rs b{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;text-transform:uppercase;color:var(--gold);letter-spacing:.04em}
.rs span{color:#ccc}.rs strong{color:#fff;font-size:1.1rem}
.rs em{background:var(--gold);color:var(--wine-d);font-style:normal;font-weight:800;border-radius:20px;padding:1px 9px;font-size:12px}
.rs.tot{margin-left:auto;padding-left:22px;border-left:1px solid #555}
.rs.warn{color:#ffb4a0;font-weight:600}
#previa{height:calc(100vh - 58px)}
#previa iframe{width:100%;height:100%;border:0;background:#fff}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Planejamento <span>Tarobá</span></h1>
  <div class="tabs"><button data-tab="montar" class="on">✎ Montar</button><button data-tab="previa">▶ Prévia do documento</button></div>
  <div class="acts">
    <button id="bHtml" class="pri" title="Baixa o planejamento como um HTML único, pronto para enviar ao cliente">⬇ Baixar HTML</button>
    <button id="bPdf" class="pri" title="Abre a prévia e a janela de impressão — escolha 'Salvar como PDF' (desmarque cabeçalhos e rodapés)">⎙ PDF / Imprimir</button>
    <details class="mais"><summary>⋯ Mais</summary><div class="menu">
      <button id="bSalvar" title="Gera um arquivo com este planejamento para enviar a outra pessoa">💾 Enviar este planejamento (arquivo)</button>
      <button id="bAbrir" title="Abre um arquivo de planejamento que outra pessoa enviou">📂 Abrir planejamento recebido</button>
      <button id="bCat" title="Volta os valores de tabela e entregas ao padrão">↺ Restaurar valores padrão</button>
      <button id="bNovo">＋ Começar um planejamento novo</button>
    </div></details>
    <input type="file" id="fileJson" accept=".json,application/json" hidden>
  </div>
</header>
<main id="montar"></main>
<div id="resumo"></div>
<div id="previa" hidden><iframe id="fr" title="Prévia do planejamento"></iframe></div>
<script>
/* ═════════════ Montador de Planejamento — Grupo Tarobá ═════════════ */
const DOC_CSS = "\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n\n:root{\n  --wine:#7A0026;--wine-dark:#5A001B;--wine-deep:#3D0012;\n  --gold:#C9A84C;--gold-light:#E8D5A3;\n  --danone-blue:#003DA5;--danone-blue-light:#0066CC;--danone-red:#E30613;\n  --white:#FFFFFF;--off-white:#F8F5F2;--charcoal:#1A1A1A;\n  --gray:#6B6B6B;--light-gray:#E8E4E0;--green:#3BA76A;\n}\n\nbody{font-family:'Barlow',sans-serif;color:var(--charcoal);background:var(--white);overflow-x:hidden;-webkit-font-smoothing:antialiased}\n\n.cover{background:var(--wine);min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:6% 8%;position:relative;overflow:hidden;color:var(--white)}\n.section-dark{background:var(--wine);color:var(--white);padding:6% 8%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}\n.section-light{background:var(--off-white);padding:6% 8%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}\n.section-white{background:var(--white);padding:6% 8%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}\n.section-charcoal{background:var(--charcoal);color:var(--white);padding:6% 8%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}\n.section-danone{background:linear-gradient(135deg, var(--danone-blue) 0%, var(--danone-blue-light) 100%);color:var(--white);padding:6% 8%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}\n.contact-section{background:var(--wine-dark);min-height:90vh;display:flex;flex-direction:column;justify-content:center;padding:6% 8%;color:var(--white)}\n\n/* ─── CAPA ─── */\n.cover::before{content:'';position:absolute;right:-20%;top:-20%;width:80%;height:140%;background:radial-gradient(circle, rgba(201,168,76,.12) 0%, transparent 60%);pointer-events:none}\n.cover::after{content:'';position:absolute;left:-10%;bottom:-30%;width:60%;height:80%;background:radial-gradient(circle, rgba(0,0,0,.25) 0%, transparent 60%);pointer-events:none}\n\n.cover-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;gap:48px}\n.cover-logo-tar img{height:110px;width:auto}\n.cover-id{font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.5);text-transform:uppercase;font-weight:600;text-align:right;line-height:1.6}\n.cover-id strong{color:var(--gold);font-weight:700}\n\n.cover-center{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto;gap:64px;align-items:center}\n.cover-center-text{display:flex;flex-direction:column;gap:28px;max-width:880px}\n.cover-eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:14px}\n.cover-eyebrow::before{content:'';width:36px;height:2px;background:var(--gold);display:inline-block}\n.cover h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(3rem,6.5vw,6rem);font-weight:900;text-transform:uppercase;line-height:.9;letter-spacing:-.02em;color:var(--white)}\n.cover h1 .gold{color:var(--gold)}\n.cover h1 .outline{-webkit-text-stroke:1.5px var(--white);color:transparent;font-weight:700}\n.cover-sub{font-size:16px;color:rgba(255,255,255,.7);max-width:620px;line-height:1.7;font-weight:400}\n\n.cover-client-logo{background:white;border-radius:14px;padding:32px 40px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;min-width:340px}\n.cover-client-logo img{height:130px;width:auto;display:block;max-width:300px;object-fit:contain}\n\n.cover-bottom{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:32px;border-top:1px solid rgba(255,255,255,.15);padding-top:28px}\n.cover-stat-num{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:900;color:var(--white);line-height:1;letter-spacing:-.02em}\n.cover-stat-num .unit{color:var(--gold);font-size:.6em;margin-left:2px}\n.cover-stat-lbl{font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.5);text-transform:uppercase;font-weight:600;margin-top:8px}\n\n/* TÍTULOS */\n.section-tag{font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:12px}\n.section-tag::before{content:'';width:28px;height:2px;display:inline-block}\n.section-tag.gold{color:var(--gold)}.section-tag.gold::before{background:var(--gold)}\n.section-tag.wine{color:var(--wine)}.section-tag.wine::before{background:var(--wine)}\n.section-tag.white{color:var(--white)}.section-tag.white::before{background:var(--white)}\n.section-tag.red{color:var(--danone-red)}.section-tag.red::before{background:var(--danone-red)}\n.section-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2.5rem,5vw,4.5rem);font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:-.015em;margin-bottom:20px}\n.section-title.light{color:var(--white)}.section-title.dark{color:var(--wine)}\n.section-title .gold{color:var(--gold)}\n.section-title .red{color:var(--danone-red)}\n.section-sub{font-size:16px;max-width:760px;line-height:1.7;font-weight:400}\n.section-sub.light{color:rgba(255,255,255,.75)}.section-sub.dark{color:var(--gray)}\n.section-header{margin-bottom:48px}\n\n/* MENSAGEM CLIENTE */\n.greeting{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;background:var(--white);border:1px solid var(--light-gray);border-left:6px solid var(--danone-blue);padding:48px;border-radius:6px;box-shadow:0 8px 32px rgba(0,61,165,.08)}\n.greeting-logo{background:var(--white);padding:24px;border-radius:8px;border:1px solid var(--light-gray);min-width:240px;display:flex;align-items:center;justify-content:center}\n.greeting-logo img{height:120px;width:auto;display:block;max-width:240px;object-fit:contain}\n.greeting-text h3{font-family:'Barlow Condensed',sans-serif;font-size:2.4rem;font-weight:800;color:var(--charcoal);letter-spacing:-.02em;margin-bottom:14px;line-height:1.05}\n.greeting-text h3 .blue{color:var(--danone-blue)}\n.greeting-text h3 .red{color:var(--danone-red)}\n.greeting-text p{font-size:15px;color:var(--gray);line-height:1.8;margin-bottom:12px}\n.greeting-text p strong{color:var(--wine);font-weight:700}\n\n/* PLANO — OVERVIEW DOS PRODUTOS */\n.plano-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}\n.plano-card{background:var(--white);border:1px solid var(--light-gray);border-top:4px solid var(--wine);border-radius:6px;padding:32px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;min-height:380px}\n.plano-card.featured{border-top-color:var(--gold);background:linear-gradient(180deg, rgba(201,168,76,.05) 0%, var(--white) 50%)}\n.plano-card-num{font-family:'Barlow Condensed',sans-serif;font-size:5rem;font-weight:900;color:rgba(122,0,38,.08);line-height:1;position:absolute;top:14px;right:24px;letter-spacing:-.02em}\n.plano-card-tag{font-size:10px;letter-spacing:.2em;color:var(--wine);text-transform:uppercase;font-weight:700;position:relative;z-index:2}\n.plano-card-title{font-family:'Barlow Condensed',sans-serif;font-size:1.7rem;font-weight:900;color:var(--wine);letter-spacing:-.01em;line-height:1.05;text-transform:uppercase;position:relative;z-index:2}\n.plano-card-desc{font-size:13px;color:var(--gray);line-height:1.7;flex:1}\n.plano-card-bullets{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--light-gray)}\n.plano-card-bullets li{font-size:12px;color:var(--charcoal);display:flex;align-items:flex-start;gap:8px;line-height:1.4}\n.plano-card-bullets li::before{content:'•';color:var(--gold);font-weight:900;font-size:14px;line-height:1;flex-shrink:0}\n.plano-card-foot{margin-top:14px;padding-top:14px;border-top:1px solid var(--light-gray);font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:800;color:var(--wine)}\n\n/* OPERAÇÃO TAROBÁ — DETALHE */\n.op-hero-wrap{width:100%;height:50vh;max-height:460px;border-radius:6px;overflow:hidden;margin-bottom:24px;position:relative}\n.op-hero-wrap img{width:100%;height:100%;object-fit:cover;display:block;object-position:center 30%}\n.op-hero-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(122,0,38,.75) 0%, transparent 55%);pointer-events:none}\n.op-hero-overlay{position:absolute;bottom:32px;left:32px;z-index:2;color:#fff;max-width:520px}\n.op-hero-overlay .badge{display:inline-block;background:var(--gold);color:var(--charcoal);font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;padding:6px 14px;border-radius:2px;margin-bottom:12px}\n.op-hero-overlay h3{font-family:'Barlow Condensed',sans-serif;font-size:2.2rem;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.01em}\n\n.op-grid-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px}\n.op-grid-photo{height:200px;border-radius:4px;overflow:hidden}\n.op-grid-photo img{width:100%;height:100%;object-fit:cover;display:block}\n\n.op-entregaveis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:32px}\n.op-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:22px 20px;text-align:center}\n.op-card .icon{font-size:26px;margin-bottom:10px}\n.op-card strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:1rem;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-weight:800;letter-spacing:.02em}\n.op-card span{font-size:11px;color:rgba(255,255,255,.55);font-weight:500;line-height:1.5;display:block}\n\n.op-cal-investimento{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:start}\n.op-cal{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:32px}\n.op- const KN_CSS = "\nhtml{scroll-behavior:smooth}\n#kn-bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#C9A84C,#E8D5A3);width:0;z-index:99;transition:width .3s ease}\n#kn-count{position:fixed;right:22px;bottom:18px;z-index:99;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:.2em;color:rgba(255,255,255,.9);background:rgba(26,26,26,.55);padding:6px 14px;border-radius:20px;backdrop-filter:blur(4px)}\n#kn-hint{position:fixed;left:22px;bottom:18px;z-index:99;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.75);background:rgba(26,26,26,.45);padding:6px 12px;border-radius:20px;backdrop-filter:blur(4px);transition:opacity 1s}\n.kn-rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}\n.kn-rv.kn-on{opacity:1;transform:none}\n@media print{#kn-bar,#kn-count,#kn-hint{display:none}.kn-rv{opacity:1!important;transform:none!important}}\n";
const KN_JS = "\n(function(){\n  var vivo = !navigator.webdriver; // geração de PDF (headless) = tudo estático\n  var slides = Array.prototype.slice.call(document.querySelectorAll('.cover,.section-dark,.section-light,.section-white,.section-charcoal,.contact-section'));\n  if (!slides.length) return;\n\n  // todo link externo abre em nova guia — nunca navega por cima da apresentação\n  Array.prototype.forEach.call(document.querySelectorAll('a[href^=\"http\"]'), function(a){\n    a.setAttribute('target', '_blank');\n    a.setAttribute('rel', 'noopener');\n  });\n\n  var bar = document.createElement('div'); bar.id = 'kn-bar'; document.body.appendChild(bar);\n  var cnt = document.createElement('div'); cnt.id = 'kn-count'; document.body.appendChild(cnt);\n  var hint = document.createElement('div'); hint.id = 'kn-hint'; hint.textContent = '▸ use as setas do teclado'; document.body.appendChild(hint);\n  setTimeout(function(){ hint.style.opacity = '0'; }, 6000);\n\n  function atual(){\n    var y = window.scrollY + window.innerHeight/2, i = 0;\n    for (var k = 0; k < slides.length; k++) if (slides[k].offsetTop <= y) i = k;\n    return i;\n  }\n  function atualiza(){\n    var i = atual();\n    bar.style.width = ((i+1)/slides.length*100) + '%';\n    cnt.textContent = ('0'+(i+1)).slice(-2) + ' · ' + ('0'+slides.length).slice(-2);\n  }\n  window.addEventListener('scroll', atualiza, {passive:true}); atualiza();\n\n  function vai(i){ if (i < 0 || i >= slides.length) return; slides[i].scrollIntoView({behavior: vivo ? 'smooth' : 'auto'}); }\n  window.addEventListener('keydown', function(e){\n    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;\n    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); vai(atual()+1); }\n    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); vai(atual()-1); }\n    else if (e.key === 'Home') { e.preventDefault(); vai(0); }\n    else if (e.key === 'End') { e.preventDefault(); vai(slides.length-1); }\n  });\n\n  if (!vivo) return; // sem animação no PDF\n\n  // reveal em cascata\n  var alvos = document.querySelectorAll('.section-header,.benefit-card,.plano-card,.fim-card,.fim-num-card,.radio-stat,.op-card,.eco-card,.muffato-stat,.greeting,.op-cal,.op-investimento-card,.invest-table,.invest-resumo,.contact-card,.cv-gallery img,.cover-center-text,.cover-client-logo');\n  Array.prototype.forEach.call(alvos, function(el, ix){\n    el.classList.add('kn-rv');\n    el.style.transitionDelay = (ix % 6) * 80 + 'ms';\n  });\n  var io = new IntersectionObserver(function(es){\n    es.forEach(function(en){ if (en.isIntersecting) en.target.classList.add('kn-on'); });\n  }, {threshold:.12});\n  Array.prototype.forEach.call(alvos, function(el){ io.observe(el); });\n\n  // count-up nos números simples (pula anos e formatos compostos tipo 4,5M / 101.7 / 3h55)\n  var nums = document.querySelectorAll('.cover-stat-num,.fim-num-val,.muffato-stat-num,.rnum,.fim-card-investimento .total');\n  Array.prototype.forEach.call(nums, function(el){\n    var tn = el.childNodes[0];\n    if (!tn || tn.nodeType !== 3) return;\n    var txt = tn.nodeValue.trim();\n    var m = txt.match(/^(\\+?)(\\d{1,3}(?:\\.\\d{3})*|\\d+)$/);\n    if (!m) return;\n    var alvo = parseInt(m[2].replace(/\\./g,''), 10);\n    if (!alvo || (alvo >= 1900 && alvo <= 2100)) return; // anos ficam parados\n    var pref = m[1], feito = false;\n    var io2 = new IntersectionObserver(function(es){\n      es.forEach(function(en){\n        if (!en.isIntersecting || feito) return;\n        feito = true;\n        var t0 = performance.now(), dur = 1300;\n        requestAnimationFrame(function tick(t){\n          var p = Math.min(1, (t - t0) / dur);\n          p = 1 - Math.pow(1 - p, 3);\n          tn.nodeValue = pref + Math.round(alvo * p).toLocaleString('pt-BR');\n          if (p < 1) requestAnimationFrame(tick); else tn.nodeValue = txt;\n        });\n      });\n    }, {threshold:.5});\n    io2.observe(el);\n  });\n})();\n";

const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(v){
  if(typeof v==='number') return isFinite(v)?v:null;
  if(v==null||v==='') return null;
  let s = String(v).replace(/[R$\s%]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); return isNaN(n)?null:n;
}
const fmt = n => n==null?'':n.toLocaleString('pt-BR',{minimumFractionDigits:(Math.round(n*100)%100?2:0),maximumFractionDigits:2});
const brl = n => 'R$ ' + fmt(Math.round((n||0)*100)/100);
const pctTxt = d => (Math.round(d*1000)/10).toLocaleString('pt-BR') + '%';
const slug = s => (s||'cliente').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'cliente';
const ativas = () => { const a = ['ldb','cvl'].filter(p=>S.pracas[p]); return a.length?a:['ldb']; };
const keyOf = (g,id,p) => g+'.'+id+'.'+p;
const nl2br = s => esc(s).replace(/\n/g,'<br>');

function periodo(){
  const a = new Date(S.per.ini+'T12:00:00'), b = new Date(S.per.fim+'T12:00:00');
  if(isNaN(a)||isNaN(b)||b<a) return {du:0,sem:0,meses:1,txt:'',ano:2026};
  let du = 0; for(let d=new Date(a); d<=b; d.setDate(d.getDate()+1)){ const w=d.getDay(); if(w>0&&w<6) du++; }
  const dias = Math.round((b-a)/864e5)+1;
  const meses = (b.getFullYear()-a.getFullYear())*12 + b.getMonth()-a.getMonth() + 1;
  const txt = a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear() ? MES[a.getMonth()]+' de '+a.getFullYear() : MES[a.getMonth()]+' a '+MES[b.getMonth()];
  return {du, sem:Math.floor(dias/7), meses, txt, ano:b.getFullYear()};
}

/* ─── cálculo ─── */
const GRUPOS = ['projetos','operacoes','radio','conteudo'];
function linhas(p){
  const out = [];
  ['projetos','operacoes'].forEach(g => out.push(...catLinhas(g,p)));
  S.radio.forEach(r => {
    if(r.praca!==p && r.praca!=='ambas') return;
    if(!S.pracas[p]) return;
    const qtd = num(r.total)||0, tab = num(r.tab)||0, neg = num(r.neg);
    out.push({g:'radio', nome:r.fmt||'Inserção de rádio', qtd, tab, neg, un:'inserção', sub: fmt(qtd)+' inserções × '+(tab?brl(neg!=null?neg:tab):'—')});
  });
  out.push(...catLinhas('conteudo',p));
  return out.sort((a,b)=>GRUPOS.indexOf(a.g)-GRUPOS.indexOf(b.g));
}
function catLinhas(g,p){
  const out = [];
  (S.cat[g]||[]).forEach(pr => {
    const s = S.sel[keyOf(g,pr.id,p)]; if(!s||!s.on) return;
    const tab = num(pr[p])||0, qtd = num(s.qtd)||1, neg = num(s.neg);
    const un = pr.un || 'un';
    let sub = pr.periodo || '';
    if(pr.mensal) sub = qtd+' '+(qtd>1?'meses':'mês')+' × '+(tab?brl(neg!=null?neg:tab):'—')+'/mês';
    else if(qtd>1) sub = qtd+' × '+(tab?brl(neg!=null?neg:tab):'—')+(pr.periodo?' · '+pr.periodo:'');
    out.push({g, pr, nome:pr.nome, qtd, tab, neg, un, mensal:!!pr.mensal, fora:!!(pr.mensal&&s.fora), sub});
  });
  return out;
}
function totais(p){
  const L = linhas(p); let tab=0, neg=0;
  L.forEach(l => { if(l.fora) return; tab += l.tab*l.qtd; neg += (l.neg!=null?l.neg:l.tab)*l.qtd; });
  const pk = num(S.pacote[p]); const pac = pk>0;
  const negF = pac?pk:neg;
  return {L, tab, neg:negF, soma:neg, pac, desc: tab>0?(1-negF/tab):0, vazios:L.filter(l=>!l.tab).length};
}

function lerImagem(file, max, q){
  return new Promise(res => { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, max/Math.max(im.width,im.height)); const c = document.createElement('canvas');
    c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg', q)); }; im.onerror = ()=>res(null); im.src = fr.result; }; fr.onerror = ()=>res(null); fr.readAsDataURL(file); });
}

function aplicarIA(txt){
  txt = String(txt||'');
  if(/Responda SOMENTE com um JSON|REGRAS:|Você é redator comercial/.test(txt)){ alert('Você colou o PEDIDO, não a resposta.\n\nCole o pedido no Claude (claude.ai), espere ele responder e copie a RESPOSTA dele (o bloco que começa com { ) para esta caixa.'); return; }
  const m = txt.match(/\{[\s\S]*\}/); if(!m){ alert('Não encontrei o JSON na resposta. Copie o bloco que começa com { e termina com }.'); return; }
  let o; try{ o = JSON.parse(m[0]); }catch(e){ alert('A resposta não está em JSON válido. Peça ao Claude: "responda só com o JSON, sem texto antes ou depois".'); return; }
  aplicarObj(o);
}
function aplicarObj(o){
  const un = v => String(v).replace(/\\n/g,'\n');
  const novo_ = JSON.parse(JSON.stringify(S.cli));
  if(o.segmento && !novo_.segmento.trim()) novo_.segmento = String(o.segmento);
  if(o.sobre && !novo_.fotosTexto.trim()) novo_.fotosTexto = String(o.sobre);
  ['headline','destaque','sub','pa_titulo','pa_p1','pa_p2'].forEach(k => { if(o[k]) novo_[k] = un(o[k]); });
  const mk = o.mercado || o.mkt;
  if(mk){
    if(mk.titulo) novo_.mkt.titulo = un(mk.titulo);
    if(mk.lead) novo_.mkt.lead = un(mk.lead);
    (mk.destaques||mk.d||[]).slice(0,3).forEach((x,i)=>{ novo_.mkt.d[i] = {num:String(x.num||''), txt:String(x.texto||x.txt||''), src:String(x.fonte||x.src||'')}; });
    (mk.extras||mk.e||[]).slice(0,4).forEach((x,i)=>{ novo_.mkt.e[i] = {num:String(x.num||''), txt:String(x.texto||x.txt||'')}; });
  }
  limpaModelo(novo_);
  const antes = JSON.stringify(S.cli);
  S.cli = novo_;
  if(!novo_.headline.trim() && !novo_.sub.trim() && !novo_.pa_p1.trim() && !mktTem()){
    alert('A resposta veio com o modelo em branco (sem conteúdo de verdade). Peça ao Claude para preencher o JSON com o texto real da proposta.');
  }
  iaOpen = false; save(); renderMontar();
}

function paint(){
  $$('[data-out]').forEach(el => {
    const d = el.dataset; let v = '';
    if(d.out==='pct'){
      const pr = S.cat[d.g].find(x=>x.id===d.id), s = S.sel[keyOf(d.g,d.id,d.p)];
      const tab = num(pr[d.p]), neg = s?num(s.neg):null;
      if(tab>0 && neg!=null) v = pctTxt(1-neg/tab);
      el.classList.toggle('neg', neg!=null && neg>tab);
    } else if(d.out==='rpct'){
      const r = S.radio[+d.i], tab = num(r.tab), neg = num(r.neg);
      if(tab>0 && neg!=null) v = pctTxt(1-neg/tab);
    } else if(d.out==='rsub'){
      const r = S.radio[+d.i], tab = num(r.tab)||0, neg = num(r.neg), q = num(r.total)||0;
      const k = r.praca==='ambas' ? ativas().length : 1;
      v = tab||neg ? brl((neg!=null?neg:tab)*q*k) : '';
    }
    el.textContent = v;
  });
  // linhas desmarcadas ficam esmaecidas
  $$('tr.prow').forEach(tr => { const on = tr.querySelector('input[data-f="on"]:checked'); tr.classList.toggle('off', !on); });
  // resumo
  const sp = ativas().map(p => ({p, t:totais(p)}));
  let tt=0, tn=0, vz=0;
  sp.forEach(x => { tt+=x.t.tab; tn+=x.t.neg; vz+=x.t.vazios; });
  $('#resumo').innerHTML = sp.map(x => '<div class="rs"><b>'+PR[x.p]+'</b><span>tabela '+brl(x.t.tab)+'</span><span>negociado <strong>'+brl(x.t.neg)+'</strong></span>'+(x.t.desc>0.0005?'<em>−'+pctTxt(x.t.desc)+'</em>':'')+'</div>').join('')
    + '<div class="rs tot"><b>Total</b><span>tabela '+brl(tt)+'</span><span>negociado <strong>'+brl(tn)+'</strong></span>'+(tt>0&&tn<tt?'<em>−'+pctTxt(1-tn/tt)+'</em>':'')+'</div>'
    + (vz?'<div class="rs warn">'+vz+' item(ns) sem valor de tabela</div>':'')
    + (!mktTem()?'<div class="rs warn">Faltam dados de mercado do setor</div>':'');
}

/* ─── eventos do editor ─── */
function setSel(g,id,p,f,v){ const k=keyOf(g,id,p); const s=S.sel[k]=S.sel[k]||{on:false,qtd:'',neg:'',fora:false}; s[f]=v; return s; }
function onEdit(e, commit){
  const el = e.target, d = el.dataset; if(!d.b) return;
  const v = el.type==='checkbox' ? el.checked : el.value;
  let struct = false;
  switch(d.b){
    case 'cli': S.cli[d.f] = v; break;
    case 'per': S.per[d.f] = v; struct = commit; if(commit) { renderMontar(); } break;
    case 'pracas': S.pracas[d.f] = v; if(!S.pracas.ldb && !S.pracas.cvl) S.pracas[d.f] = true; struct = true; break;
    case 'tela': S.tela[d.f] = v; break;
    case 'cfg': cfgSalva(d.f, v); return;
    case 'mkt': if(d.k) S.cli.mkt[d.k][+d.i][d.f] = v; else S.cli.mkt[d.f] = v; break;
    case 'root': S[d.f] = v; break;
    case 'rootchk': S[d.f] = v; break;
    case 'contato': S.contato[d.f] = v; break;
    case 'pacote': S.pacote[d.f] = v; if(commit) el.value = num(v)==null?'':fmt(num(v)); break;
    case 'sel': {
      let val = v;
      if(d.f==='neg'||d.f==='qtd') { val = v; }
      const s = setSel(d.g,d.id,d.p,d.f,val);
      if(d.f==='on' && v){
        const pr = S.cat[d.g].find(x=>x.id===d.id);
        if(s.qtd===''||s.qtd==null){ const sem = periodo().sem; s.qtd = pr.semanal ? (sem||1) : (pr.mensal ? (periodo().meses||1) : 1); struct = true; }
      }
      if(commit && d.f==='neg') el.value = num(v)==null?'':fmt(num(v));
      break; }
    case 'cat': { const pr = S.cat[d.g].find(x=>x.id===d.id); pr[d.f] = num(v)||0; if(commit) el.value = pr[d.f]?fmt(pr[d.f]):''; break; }
    case 'catx': { const pr = S.cat[d.g].find(x=>x.id===d.id);
      if(d.f==='entregas') pr.entregas = String(v).split('\n').map(s=>s.trim()).filter(Boolean);
      else pr[d.f] = v;
      if(commit && (d.f==='nome'||d.f==='periodo'||d.f==='mensal')) struct = true;
      break; }
    case 'radio': { const r = S.radio[+d.i]; r[d.f] = v;
      if(d.f==='dia'||d.f==='dias'){ const a=num(r.dia), b=num(r.dias); if(a&&b){ r.total = String(a*b); const t=el.closest('tr').querySelector('[data-f="total"]'); if(t) t.value = r.total; } }
      if(d.f==='fmt' && commit){ const c = S.cat.radio.find(x=>x.nome.toLowerCase()===String(v).trim().toLowerCase()); if(c){ r.fmt=c.nome; fillTab(r); struct = true; } }
      if(d.f==='praca' && commit){ if(S.cat.radio.find(x=>x.nome===r.fmt) && !num(r.tab)) fillTab(r); struct = true; }
      if(commit && (d.f==='tab'||d.f==='neg')) el.value = num(v)==null?'':fmt(num(v));
      break; }
    case 'rcat': { const r = S.cat.radio[+d.i]; r[d.f] = (d.f==='ldb'||d.f==='cvl') ? (num(v)||0) : v; if(commit && (d.f==='ldb'||d.f==='cvl')) el.value = r[d.f]?fmt(r[d.f]):''; if(commit && d.f==='nome') struct = true; break; }
  }
  save();
  if(struct && d.b!=='per') renderMontar(); else paint();
}
function fillTab(r){ const c = S.cat.radio.find(x=>x.nome===r.fmt); if(!c) return; const p = r.praca==='ambas' ? ativas()[0] : r.praca; r.tab = c[p] ? String(c[p]) : ''; }

    case 'addradio': { const a=ativas(); S.radio.push({fmt:'',praca:a.length===2?'ambas':a[0],dia:'',dias:String(periodo().du||''),total:'',tab:'',neg:''}); save(); renderMontar(); break; }
    case 'delradio': S.radio.splice(+d.i,1); save(); renderMontar(); break;
    case 'addfmt': S.cat.radio.push({id:'f'+Date.now().toString(36),nome:'Novo formato',desc:'',ldb:0,cvl:0}); save(); renderMontar(); break;
    case 'delfmt': S.cat.radio.splice(+d.i,1); save(); renderMontar(); break;
    case 'auto': { const vazio = !S.cli.headline.trim() && !S.cli.sub.trim();
      if(vazio || confirm('Substituir os textos atuais da capa e do "Por que agora" pelos automáticos?')) sugerir(true); break; }
    case 'iaopen': iaOpen = !iaOpen; renderMontar(); break;
    case 'pesq': pesquisarAuto(); break;
    case 'iacopy': { const t = $('#iaPrompt'); t.select(); let ok=false; try{ ok = document.execCommand('copy'); }catch(e){}
      if(!ok && navigator.clipboard) navigator.clipboard.writeText(t.value); b.textContent = '✔ Copiado'; break; }
    case 'iaapply': aplicarIA($('#iaResp').value); break;
    case 'rmfoto': S.cli.fotos.splice(+d.i,1); save(); renderMontar(); break;
    case 'rmlogo': S.cli.logo=''; save(); renderMontar(); break;
  }
});

});

  /* visão geral */
  const frentes = [];
  if(proj.length) frentes.push({k:'proj', tag:'★ TV + Multiplataforma', title:'Projetos<br>Especiais '+sp.ano, desc:'A marca dentro dos maiores projetos do calendário Tarobá — reality, campanhas e especiais com exibição na TV, rádio, portal e redes.', li:proj.map(x=>x.pr.nome), foot:proj.length+(proj.length>1?' projetos':' projeto')+(sp.txt?' · '+sp.txt:'')});
  if(rad.length) frentes.push({k:'rad', tag:'Rádio Tarobá FM', title:'No ar<br>todos os dias', desc:'Presença diária na programação da Rádio Tarobá FM 101.7, com a frequência que constrói a primeira lembrança de marca.', li:rad.map(r=>r.nome+' · '+A.map(p=>fmt(r.q[p]||0)).filter((x,i)=>r.q[A[i]]).join(' + ')+' ins.'), foot:fmt(rad.reduce((s,r)=>s+A.reduce((t,p)=>t+(r.q[p]||0),0),0))+' inserções no período'});
  if(ops.length) frentes.push({k:'ops', tag:'Ponto de venda', title:'Operação<br>Tarobá', desc:'A marca fisicamente dentro do supermercado: promotoras, inflável, degustação na gôndola e flashes ao vivo na rádio direto da loja.', li:ops.map(o=>o.pr.nome+' · '+A.map(p=>o.q[p]).filter(Boolean).join(' + ')+' '+(o.pr.un||'ação')+'s'), foot:acoes+' ações com degustação no Muffato'});
  if(cont.length) frentes.push({k:'cont', tag:'Extensões de conteúdo', title:'Conteúdo e<br>patrocínios', desc:'Formatos que estendem a marca além do intervalo comercial: conteúdo próprio, programas e patrocínios editoriais.', li:cont.map(x=>x.pr.nome), foot:cont.length+(cont.length>1?' formatos':' formato')});
  frentes.forEach((f,i)=>f.n = ('0'+(i+1)).slice(-2));
  const numOf = k => (frentes.find(f=>f.k===k)||{}).n || '';
  if(frentes.length) slides.push('<div class="section-light">'+hdr('Visão geral · O plano', frentes.length+' frente'+(frentes.length>1?'s':'')+'.<br>Uma marca presente de ponta a ponta.', false)
    + '<div class="plano-grid" style="grid-template-columns:repeat('+Math.min(frentes.length,4)+',1fr)">'
    + frentes.map((f,i)=>'<div class="plano-card'+(i===0?' featured':'')+'"><div class="plano-card-num">'+f.n+'</div><div class="plano-card-tag">'+f.tag+'</div><div class="plano-card-title">'+f.title+'</div><p class="plano-card-desc">'+f.desc+'</p><ul class="plano-card-bullets">'+f.li.slice(0,6).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="plano-card-foot">'+esc(f.foot)+'</div></div>').join('')
    + '</div></div>');

  /* cartões de detalhe */
  const fimCard = (tag,nome,praca,total,parc,lis) => '<div class="fim-card"><div class="fim-card-tag">'+esc(tag)+'</div><div class="fim-card-name">'+esc(nome)+'</div>'+(praca?'<div class="fim-card-praca">'+esc(praca)+'</div>':'')
    + '<div class="fim-card-investimento"><span class="total">'+esc(total)+'</span><span class="parcelas">'+esc(parc)+'</span></div><ul>'+lis.map(x=>'<li>'+esc(x.split(' | ')[0])+'</li>').join('')+'</ul></div>';
  let alt = 0;
  const chunkSlides = (cards, tag, title, dark) => {
    for(let i=0;i<cards.length;i+=2){
      const c = cards.slice(i,i+2);
      const bg = (alt++%2===0) ? 'section-charcoal' : 'section-dark';
      slides.push('<div class="'+bg+'">'+hdr(tag, title, true)+'<div class="fim-row" style="margin-top:0'+(c.length===1?';grid-template-columns:1fr;max-width:860px':'')+'">'+c.join('')+'</div></div>');
    }
  };
  if(proj.length) chunkSlides(proj.map(x=>fimCard(x.pr.periodo||'Projeto especial', x.pr.nome, A.length===2?'Londrina e Cascavel':PR[A[0]], (A.map(p=>x.q[p]).filter(Boolean).reduce((a,b)=>Math.max(a,b),1))>1 ? (A.map(p=>x.q[p]).filter(Boolean).reduce((a,b)=>Math.max(a,b),1))+' cotas' : '1 cota', 'valores no resumo final', x.pr.entregas||[])),
    'Frente '+numOf('proj')+' · Projetos especiais', 'Projetos<br><span class="gold">especiais.</span>');

  /* operação */
  if(ops.length){
    const rowsOp = []; ops.forEach(o => (o.pr.entregas||[]).forEach(t => { const [a,b] = t.split(' | '); rowsOp.push('<div class="op-cal-row"><div>'+esc(a)+'</div><div>'+esc(b||'★')+'</div></div>'); }));
    const por = A.map(p=>PR[p]+' '+ops.reduce((s,o)=>s+(o.q[p]||0),0)).join(' · ');
    slides.push('<div class="section-dark">'+hdr('Frente '+numOf('ops')+' · Ponto de venda','Sua marca dentro da loja,<br><span class="gold">toda semana.</span>',true)
      + (S.tela.fotos?'<div class="op-grid-photos">'+FOTOS.map((f,i)=>'<div class="op-grid-photo"><img src="'+f+'" alt="Operação Tarobá '+(i+1)+'"></div>').join('')+'</div>':'')
      + '<div class="op-cal-investimento"><div class="op-cal"><h4>O que acontece em cada operação</h4><div class="op-cal-table">'+rowsOp.join('')
      + '<div class="op-cal-row total"><div>'+esc(ops.map(o=>o.pr.nome).join(' + '))+(sp.txt?' · '+esc(sp.txt):'')+'</div><div>'+acoes+' ações</div></div></div></div>'
      + '<div class="op-investimento-card"><div class="lbl">Operação Tarobá'+(sp.txt?' · '+esc(sp.txt):'')+'</div><div class="val">'+acoes+' ações</div><div class="desc">'+esc(por)+'</div><hr><div class="breakdown">Nas fotos: <strong>ações reais da Operação Tarobá</strong> em supermercados da região — já rodamos para <strong>Tirol, Moinho Globo, Danone</strong> e outras marcas. <strong>Valores no resumo final.</strong></div></div></div></div>');
  }

  /* rádio */
  if(rad.length){
    const descOf = n => { const c = S.cat.radio.find(x=>x.nome===n); return c&&c.desc ? c.desc : ''; };
    const cards = rad.map(r => {
      const tot = A.reduce((s,p)=>s+(r.q[p]||0),0);
      const ps = A.filter(p=>r.q[p]);
      const equal = ps.every(p=>r.q[p]===r.q[ps[0]]);
      const dd = (num(r.dia)&&num(r.dias)) ? fmt(num(r.dia))+' inserções/dia · '+fmt(num(r.dias))+' dias úteis' : 'Rádio Tarobá FM 101.7';
      return fimCard('Rádio Tarobá FM · '+ps.map(p=>PR[p]).join(' + '), r.nome, dd, equal?fmt(r.q[ps[0]]):ps.map(p=>PR[p].slice(0,3)+' '+fmt(r.q[p])).join(' · '), equal?(ps.length>1?'inserções por praça no período':'inserções no período'):'inserções no período',
        [descOf(r.nome)||'Presença diária na programação', ps.length>1?fmt(tot)+' inserções somando as praças':''].filter(Boolean));
    });
    chunkSlides(cards,'Frente '+numOf('rad')+' · Rádio Tarobá FM 101.7','No ar <span class="gold">todos os dias</span>'+(sp.txt?',<br>de '+esc(sp.txt):'')+'.');
  }

  /* conteúdo */
  if(cont.length) chunkSlides(cont.map(x=>fimCard(x.pr.periodo||'Conteúdo', x.pr.nome, A.length===2?'Londrina e Cascavel':PR[A[0]], (A.map(p=>x.q[p]).filter(Boolean).reduce((a,b)=>Math.max(a,b),1))+' '+(x.pr.mensal?'mês(es)':(x.pr.un||'un')+'(s)'), 'valores no resumo final', x.pr.entregas||[])),
    'Frente '+numOf('cont')+' · Extensões de conteúdo','Conteúdo e<br><span class="gold">patrocínios.</span>');

  /* investimento por praça */
  const mt = S.mostrarTab;
  const rowHTML = (l, pac) => {
    const totTab = l.tab*l.qtd, totNeg = pac ? totTab : (l.neg!=null?l.neg:l.tab)*l.qtd;
    const d = totTab>0 ? 1-totNeg/totTab : 0;
    let val = totTab||totNeg ? brl(totNeg) : '<span style="font-size:.9rem;color:var(--gray)">a definir</span>';
    if(l.fora) val = brl(l.neg!=null?l.neg:l.tab)+'<span style="font-size:.85rem">/mês</span>';
    else if(mt && d>0.0005 && !pac) val = '<span class="old">'+brl(totTab)+'</span>'+val+'<span class="pct">−'+pctTxt(d)+'</span>';
    const nm = l.g==='radio' ? l.nome : l.nome;
    return '<div class="invest-row"><div class="name"><strong>'+esc(nm)+'</strong><span>'+esc(l.sub)+(l.fora?' · valor mensal, fora da soma':'')+'</span></div><div class="val">'+val+'</div></div>';
  };
  const tabelaInv = p => {
    const t = T[p];
    let h = '<div class="invest-table'+(t.L.length>6?' dense':'')+'"><h4>'+PR[p]+' <span>valores líquidos'+(sp.txt?' · '+esc(sp.txt):'')+'</span></h4>';
    h += t.L.length ? t.L.map(l=>rowHTML(l,t.pac)).join('') : '<div class="invest-row"><div class="name"><strong>Nenhum item selecionado</strong></div></div>';
    if(mt && t.tab>0 && Math.abs(t.tab-t.neg)>0.5){
      h += '<div class="invest-row sub"><div class="name"><strong>Valor de tabela</strong></div><div class="val old2">'+brl(t.tab)+'</div></div>';
      h += '<div class="invest-row sub"><div class="name"><strong>Condição negociada</strong><span>desconto sobre a tabela</span></div><div class="val">−'+pctTxt(t.desc)+' <span style="font-size:.9rem">(−'+brl(t.tab-t.neg)+')</span></div></div>';
    }
    const fora = t.L.filter(l=>l.fora);
    h += '<div class="invest-row total"><div class="name"><strong>Total '+PR[p]+'</strong><span>'+(t.pac?'valor fechado do pacote':'soma dos itens')+(fora.length?' · + '+fora.map(l=>l.nome+' '+brl(l.neg!=null?l.neg:l.tab)+'/mês').join(' · '):'')+'</span></div><div class="val">'+brl(t.neg)+'</div></div></div>';
    return h;
  };
  slides.push('<div class="section-light">'+hdr('Investimento'+(sp.txt?' · '+esc(sp.txt):''),'Resumo modular.',false)
    + '<div class="fim-row" style="margin-top:0'+(A.length===1?';grid-template-columns:1fr;max-width:760px;margin-left:auto;margin-right:auto':'')+'">'+A.map(tabelaInv).join('')+'</div></div>');

  /* total */
  const gTab = A.reduce((s,p)=>s+T[p].tab,0), gNeg = A.reduce((s,p)=>s+T[p].neg,0);
  const foraT = []; A.forEach(p=>T[p].L.filter(l=>l.fora).forEach(l=>foraT.push(l.nome+' '+PR[p]+' '+brl(l.neg!=null?l.neg:l.tab)+'/mês')));
  const frentesTxt = [proj.length?'nos projetos especiais do calendário':'', rad.length?'todos os dias no rádio':'', ops.length?'dentro do supermercado com degustação':'', cont.length?'com conteúdo próprio':''].filter(Boolean);
  slides.push('<div class="section-white">'+hdr('Investimento · Consolidado','O pacote completo.',false)
    + '<div class="invest-resumo" style="margin-top:24px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center"><div><div class="tag">Plano completo · '+esc(praçasTxt)+'</div><h3 style="margin-bottom:8px">'+esc(C)+' presente de ponta a ponta.</h3>'
    + '<p style="margin-bottom:0">'+(frentesTxt.length?'Marca presente '+frentesTxt.join(', ')+'. ':'')+esc(S.cond)+'</p></div>'
    + '<div class="total-val" style="text-align:right"><span class="lbl">Investimento total · '+(A.length===2?'2 praças':PR[A[0]])+'</span>'
    + (mt && gTab>0 && gTab-gNeg>0.5 ? '<span class="desc" style="text-decoration:line-through;opacity:.7">Tabela '+brl(gTab)+'</span>' : '')
    + '<span class="num">'+brl(gNeg)+'</span>'
    + '<span class="desc">'+(mt && gTab>0 && gTab-gNeg>0.5 ? '−'+pctTxt(1-gNeg/gTab)+' sobre a tabela · ' : '')+(sp.meses>1&&gNeg>0 ? '≈ '+brl(gNeg/sp.meses)+'/mês no período' : '')+(foraT.length?' · + '+esc(foraT.join(' · ')):'')+'</span></div></div>'
    + '<p style="text-align:center;font-size:13px;color:var(--gray);margin-top:22px;letter-spacing:.04em"><b>'+esc(S.nota)+'</b></p></div>');

  /* contato */
  const dig = S.contato.fone.replace(/\D/g,''); const wa = dig ? (dig.length<=11?'55'+dig:dig) : '';
  slides.push('<div class="contact-section">'+hdr('Próximo passo','Vamos colocar '+esc(C)+'<br>no <span class="gold">ar?</span>',true)
    + '<div class="contact-card"><div><div class="cta-name">'+esc(S.contato.nome)+'</div><div class="cta-role">'+esc(S.contato.cargo)+'</div><div class="cta-contacts">'
    + (dig?'<a href="tel:+'+wa+'">'+esc(S.contato.fone)+'</a>':'')+(S.contato.email?'<a href="mailto:'+esc(S.contato.email)+'">'+esc(S.contato.email)+'</a>':'')+'</div></div>'
    + (wa?'<a class="cta-btn" href="https://wa.me/'+wa+'" target="_blank" rel="noopener">Chamar no WhatsApp</a>':'')+'</div></div>'
    + '<footer><div class="meta">Grupo Tarobá · Proposta '+esc(C)+' · '+sp.ano+'</div><div class="meta">'+esc(S.contato.nome)+' · '+esc(S.contato.fone)+' · '+esc(S.contato.email)+'</div></footer>');

  const extra = '.invest-row .val .old{display:block;font-size:.8rem;color:var(--gray);text-decoration:line-through;font-weight:600;letter-spacing:0}'
    + '.invest-row .val .pct{display:inline-block;background:var(--gold);color:var(--wine-deep);font-size:.65rem;font-weight:800;padding:2px 8px;border-radius:20px;margin-top:4px;letter-spacing:.04em;font-family:Barlow,sans-serif}'
    + '.invest-row.sub .name strong{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.08em}.invest-row.sub .val{font-size:1.15rem;color:var(--gray)}.invest-row.sub .val.old2{text-decoration:line-through}'
    + '.contact-section .cta-contacts a{display:block}'
    + '.invest-table.dense{padding:16px 20px}.invest-table.dense h4{margin-bottom:8px}.invest-table.dense .invest-row{padding:5px 0}.invest-table.dense .invest-row .name strong{font-size:12px;margin-bottom:1px}.invest-table.dense .invest-row .name span{font-size:9.5px}.invest-table.dense .invest-row .val{font-size:1.15rem}.invest-table.dense .invest-row.total{padding-top:12px}.invest-table.dense .invest-row.total .val{font-size:1.9rem}';
  const printCss = '@page{size:1280px 800px;margin:0}@media print{html,body{width:1280px}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.cover,.section-dark,.section-light,.section-white,.section-charcoal,.contact-section{min-height:800px!important;height:auto;break-after:page;page-break-after:always;break-inside:avoid-page;padding:4% 7%!important;display:flex!important}footer{display:none}.fim-row,.plano-grid,.op-grid-photos,.op-entregaveis,.op-cal-investimento,.fim-numeros-topo,.eco-row,.muffato-stats,.cover-center,.cover-bottom,.greeting,.radio-stats,.invest-grid{display:grid!important}.eco-row{display:flex!important}}';
  const css = DOC_CSS + extra + printCss;
  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grupo Tarobá × '+esc(C)+' — Proposta Comercial '+sp.ano+'</title>'
    + '<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">'
    + '<style>'+css+'</style></head><body>'+slides.join('\n')+'<style id="kn-css">'+KN_CSS+'</style><script>'+KN_JS+'<\/script></body></html>';
}

/* ═════════════ AÇÕES (topo) ═════════════ */
function baixar(nome, conteudo, tipo){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo],{type:tipo})); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function mostra(tab){
  $('#montar').hidden = tab!=='montar'; $('#resumo').hidden = tab!=='montar'; $('#previa').hidden = tab!=='previa';
  $$('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  if(tab==='previa') $('#fr').srcdoc = buildDoc();
  window.scrollTo(0,0);
}
$$('.tabs button').forEach(b => b.addEventListener('click', ()=>mostra(b.dataset.tab)));
$('#bHtml').addEventListener('click', ()=>baixar('proposta-taroba-'+slug(S.cli.nome)+'.html', buildDoc(), 'text/html'));
$('#bPdf').addEventListener('click', ()=>{ mostra('previa'); setTimeout(()=>{ const w=$('#fr').contentWindow; w.focus(); w.print(); }, 900); });
$('#bSalvar').addEventListener('click', ()=>baixar('planejamento-'+slug(S.cli.nome)+'.json', JSON.stringify(S), 'application/json'));
$('#bAbrir').addEventListener('click', ()=>$('#fileJson').click());
$('#fileJson').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => { try{ S = migra(JSON.parse(r.result)); save(); renderMontar(); mostra('montar'); }catch(err){ alert('Arquivo inválido.'); } };
  r.readAsText(f); e.target.value = '';
});
$('#bNovo').addEventListener('click', ()=>{ if(confirm('Começar um planejamento novo? O que está na tela será apagado (o catálogo volta ao padrão).')){ S = novo(); save(); renderMontar(); mostra('montar'); } });
$('#bCat').addEventListener('click', ()=>{ if(confirm('Restaurar o catálogo e os valores de tabela padrão? Suas seleções e dados do cliente são mantidos.')){ S.cat = catPadrao(); save(); renderMontar(); } });

renderMontar();

</script>
</body>
